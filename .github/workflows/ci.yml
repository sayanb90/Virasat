name: Virasat CI Gatekeeper & Cucumber BDD Test Suite

on:
  push:
    branches: [ main, testing ]
  pull_request:
    branches: [ main, testing ]

jobs:
  test-and-build:
    name: Run Cucumber BDD Tests & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Next.js Build
        run: npm run build

      - name: Execute Cucumber BDD Test Suite
        run: npm test

      - name: Upload Cucumber HTML Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: cucumber-report.html
