name: Virasat CI Gatekeeper & Cucumber BDD Test Suite

on:
  push:
    branches: [ main, testing ]
  # Every pull request, whatever it targets. Restricting this to main and
  # testing meant a stacked PR (one branch based on another) was merged
  # with no checks having run on it at all.
  pull_request:

jobs:
  test-and-build:
    name: Run Cucumber BDD Tests & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Next.js Build
        run: npm run build

      - name: Execute Cucumber BDD Test Suite
        run: npm test

      - name: Upload Cucumber HTML Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: cucumber-report.html

      # Browsers are not on the runner image, and only Chromium is needed.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Runs against the production build above, not the dev server, so the
      # specs exercise what actually ships.
      - name: Execute End-to-End Flow Tests
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
