name: Virasat CI Gatekeeper & Cucumber BDD Test Suite

on:
  push:
    branches: [ main, testing ]
  # Every pull request, whatever it targets. Restricting this to main and
  # testing meant a stacked PR (one branch based on another) was merged
  # with no checks having run on it at all.
  pull_request:

jobs:
  test-and-build:
    name: Run Cucumber BDD Tests & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # The two artifacts that ship: the static app the native shell bundles
      # (out/) and the API host (.next/). App first — the API build rewrites
      # .next but leaves out/ alone.
      - name: Build the static app and the API
        run: npm run build:e2e-split

      # Unit tests (tests/unit) and Cucumber, under coverage. Fails if any
      # file written in phases 2 and 3 drops below its gate (.c8-new-code.json).
      - name: Execute Unit Tests and Cucumber BDD Suite, with coverage
        run: npm run test:coverage

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Upload Cucumber HTML Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: cucumber-report.html

      # Browsers are not on the runner image, and only Chromium is needed.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The shipping topology: the static export on one origin, talking to
      # the API on another, exactly as the native app does. The combined
      # single-server mode (`npm run test:e2e`) is for local development.
      - name: Execute End-to-End Flow Tests (static app + separate API)
        run: npm run test:e2e:split

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
